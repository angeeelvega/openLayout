[package]
name = "openlayout"
version = "0.1.0"
edition = "2021"
description = "A scrolling window manager for macOS"
license = "MIT"
publish = false

[lib]
name = "openlayout"
path = "src/lib.rs"

[[bin]]
name = "openlayout"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc = "0.2.7"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
